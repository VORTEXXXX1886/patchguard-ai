[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchguard-ai"
version = "0.1.0"
description = "Validate AI-generated and human patch changes for scope, safety, and verification readiness."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "VORTEXXXX1886" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
patchguard-ai = "patchguard_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
